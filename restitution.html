<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restitution — Chasse aux risques</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101418; --surface:#1b222b; --surface2:#232c37;
    --text:#f2f5f7; --muted:#9aa7b4;
    --danger:#ff5a3c; --good:#35d07f;
    --melec:#ffc800; --maint:#3d8bff; --chaud:#ff7a00;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,sans-serif;padding:24px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1300px;margin:0 auto 22px;flex-wrap:wrap}
  h1{font-size:30px;font-weight:900}
  h1 span{color:var(--danger)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select,button.b{
    background:var(--surface);color:var(--text);border:2px solid var(--surface2);border-radius:12px;
    padding:11px 16px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
  }
  .nav{display:flex;gap:6px}
  .nav button{width:48px;font-size:20px}

  .stage{max-width:1300px;margin:0 auto}
  .group-head{display:flex;align-items:baseline;gap:14px;margin:8px 0 18px;flex-wrap:wrap}
  .group-head h2{font-size:42px;font-weight:900}
  .badge{border-radius:999px;padding:7px 16px;font-weight:900;font-size:16px;color:#111;background:var(--surface2);color:var(--text)}
  .badge.MELEC{background:var(--melec);color:#111}
  .badge.TCI{background:var(--chaud);color:#111}
  .badge.IMTB{background:var(--maint);color:#fff}
  .badge.CIEL{background:#a78bfa;color:#111}
  .badge.MSPC{background:#2dd4bf;color:#111}
  .group-head .stat{color:var(--muted);font-size:17px;font-weight:700}

  h3.sec{font-size:22px;font-weight:900;margin:26px 0 12px}
  h3.sec.r{color:var(--danger)} h3.sec.b{color:var(--good)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{background:var(--surface);border-radius:18px;overflow:hidden;border:2px solid var(--surface2)}
  .card.r{border-color:rgba(255,90,60,.45)} .card.b{border-color:rgba(53,208,127,.45)}
  .card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#000;cursor:zoom-in}
  .card .body{padding:14px 16px;font-size:15px;line-height:1.5}
  .card .lab{font-weight:900;font-size:14px;display:block;margin-bottom:4px}
  .card.r .lab{color:var(--danger)} .card.b .lab{color:var(--good)}
  .card .fld{margin-top:8px}
  .card .fld b{color:var(--muted);font-size:12.5px;font-weight:700;display:block}
  .empty{color:var(--muted);font-size:16px;padding:14px 0}

  /* suivi des groupes */
  .suivi{max-width:1000px;margin:0 auto;width:100%;border-collapse:separate;border-spacing:0 8px}
  .suivi th{color:var(--muted);font-size:14px;font-weight:700;text-align:center;padding:6px 10px}
  .suivi th:first-child{text-align:left}
  .suivi td{background:var(--surface);padding:16px 12px;text-align:center;font-weight:900;font-size:19px}
  .suivi td:first-child{text-align:left;border-radius:16px 0 0 16px;font-size:20px}
  .suivi td:last-child{border-radius:0 16px 16px 0}
  .suivi td .medal{margin-right:8px}
  .suivi td .at{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
  .suivi .cr{color:var(--danger)} .suivi .cb{color:var(--good)} .suivi .cp{color:var(--melec)}

  .loading{color:var(--muted);text-align:center;padding:60px 0;font-size:18px}

  /* zoom photo */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
  .lightbox.show{display:flex}
  .lightbox img{max-width:94vw;max-height:94vh;border-radius:10px}
</style>
</head>
<body>
  <div class="top">
    <h1>🎤 Restitution — <span>Chasse aux risques</span></h1>
    <div class="controls">
      <button class="b" id="btn-palmares">📊 Suivi des groupes</button>
      <select id="sel-groupe"></select>
      <div class="nav">
        <button class="b" id="prev">←</button>
        <button class="b" id="next">→</button>
      </div>
      <button class="b" id="refresh">🔄 Actualiser</button>
    </div>
  </div>

  <div class="stage" id="stage"><p class="loading">⏳ Chargement des observations…</p></div>
  <div class="lightbox" id="lb"><img alt=""></div>

<script>
/* ================================================================
   👉👉 COLLER ICI LA MÊME URL /exec DU SCRIPT APPS SCRIPT 👈👈
   ================================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBUDrcQ9KUgYvtYKUv4vT4pLy7I6T3oBh0ivdjKzYahvXr2dI6CcPipipwYae0cQex/exec";

let data = { risques:[], bp:[], fins:[] };
let groupes = [];
let idx = -1;              // -1 = suivi des groupes
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function finTime(g){
  const f = (data.fins||[]).find(x=>x.groupe===g);
  if(!f) return '';
  const m = String(f.horodatage).match(/(\d{1,2}):(\d{2})/);
  return m ? m[1] + 'h' + m[2] : '🏁';
}

let lastJson = '';
async function load(silent){
  if(!silent) $('stage').innerHTML = '<p class="loading">⏳ Chargement des observations…</p>';
  try{
    const rep = await fetch(SCRIPT_URL + '?action=getData&t=' + Date.now());
    const txt = await rep.text();
    if(silent && txt === lastJson) return;   // rien de nouveau : on ne touche pas l'écran
    lastJson = txt;
    data = JSON.parse(txt);
    data.fins = data.fins || [];
    const set = new Set([...data.risques, ...data.bp, ...data.fins].map(r=>r.groupe));
    groupes = [...set].sort((a,b)=>a.localeCompare(b,'fr'));
    const sel = $('sel-groupe');
    sel.innerHTML = '<option value="-1">— Choisir un groupe —</option>' +
      groupes.map((g,i)=>`<option value="${i}">${esc(g)}</option>`).join('');
    if(idx >= groupes.length) idx = groupes.length - 1;
    const y = window.scrollY;
    render();
    if(silent) window.scrollTo(0, y);        // on garde la position de lecture
  }catch(e){
    if(!silent) $('stage').innerHTML = '<p class="loading">Impossible de charger les données. Vérifiez l\'URL du script, puis cliquez sur 🔄 Actualiser.</p>';
  }
}

function render(){
  if(idx < 0 || !groupes.length){ renderPalmares(); return; }
  $('sel-groupe').value = idx;
  const g = groupes[idx];
  const r = data.risques.filter(x=>x.groupe===g);
  const b = data.bp.filter(x=>x.groupe===g);
  const atelier = (r[0]||b[0]||data.fins.find(x=>x.groupe===g)||{}).atelier || '';
  $('stage').innerHTML = `
    <div class="group-head">
      <h2>👥 ${esc(g)}</h2>
      <span class="badge ${esc(atelier)}">${esc(atelier)}</span>
      <span class="stat">🚨 ${r.length} risque(s) · ⭐ ${b.length} bonne(s) pratique(s)${finTime(g) ? ` · <span style="color:var(--good)">🏁 terminé à ${finTime(g)}</span>` : ''}</span>
    </div>
    <h3 class="sec r">🚨 Situations dangereuses repérées</h3>
    ${ r.length ? `<div class="grid">` + r.map(x=>`
      <div class="card r">
        ${x.photo ? `<img src="${esc(x.photo)}" loading="lazy" alt="situation dangereuse">` : ''}
        <div class="body">
          <span class="lab">⚠️ ${esc(x.risque)}</span>
          ${esc(x.situation)}
          <div class="fld"><b>💡 Proposition d'amélioration</b>${esc(x.amelioration)}</div>
        </div>
      </div>`).join('') + `</div>` : `<p class="empty">Aucune situation dangereuse enregistrée.</p>` }
    <h3 class="sec b">⭐ Bonnes pratiques repérées</h3>
    ${ b.length ? `<div class="grid">` + b.map(x=>`
      <div class="card b">
        ${x.photo ? `<img src="${esc(x.photo)}" loading="lazy" alt="bonne pratique">` : ''}
        <div class="body">
          <span class="lab">⭐ ${esc(x.type)}</span>
          ${esc(x.description)}
        </div>
      </div>`).join('') + `</div>` : `<p class="empty">Aucune bonne pratique enregistrée.</p>` }
  `;
}

function renderPalmares(){
  idx = -1;
  $('sel-groupe').value = "-1";
  if(!groupes.length){
    $('stage').innerHTML = '<p class="loading">Aucune observation pour l\'instant. Les équipes sont encore à la chasse 🕵️</p>';
    return;
  }
  const rows = groupes.map(g=>{
    const r = data.risques.filter(x=>x.groupe===g);
    const b = data.bp.filter(x=>x.groupe===g);
    const nph = [...r, ...b].filter(x=>x.photo).length;
    return { g, atelier:(r[0]||b[0]||data.fins.find(x=>x.groupe===g)||{}).atelier||'', nr:r.length, nb:b.length, nph, tot:r.length+b.length };
  }).sort((a,b)=>b.tot-a.tot);
  const medals = ['🥇','🥈','🥉'];
  $('stage').innerHTML = `<table class="suivi">
    <tr><th>Groupe</th><th>🚨 Risques</th><th>⭐ Bonnes pratiques</th><th>📷 Photos</th><th>Total</th><th>🏁 Terminé</th></tr>` +
    rows.map((r,i)=>`
    <tr>
      <td><span class="medal">${medals[i] || '&nbsp;&nbsp;'+(i+1)}</span>${esc(r.g)}<span class="at">${esc(r.atelier)}</span></td>
      <td class="cr">${r.nr}</td>
      <td class="cb">${r.nb}</td>
      <td class="cp">${r.nph}</td>
      <td>${r.tot}</td>
      <td>${finTime(r.g) ? `<span class="cb">🏁 ${finTime(r.g)}</span>` : `<span style="color:var(--muted);font-size:15px">⏳ en cours</span>`}</td>
    </tr>`).join('') + `</table>`;
}

$('sel-groupe').onchange = e => { idx = parseInt(e.target.value,10); render(); };
$('prev').onclick = () => { if(groupes.length){ idx = (idx <= 0) ? groupes.length-1 : idx-1; render(); } };
$('next').onclick = () => { if(groupes.length){ idx = (idx >= groupes.length-1) ? 0 : idx+1; render(); } };
$('btn-palmares').onclick = renderPalmares;
$('refresh').onclick = () => load(true);
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') $('next').click();
  if(e.key==='ArrowLeft') $('prev').click();
});

/* zoom photo */
document.addEventListener('click', e=>{
  if(e.target.matches('.card img')){
    $('lb').querySelector('img').src = e.target.src.replace('sz=w1200','sz=w2000');
    $('lb').classList.add('show');
  }
});
$('lb').onclick = () => $('lb').classList.remove('show');

load();
setInterval(()=>load(true), 60000);   /* rafraîchissement auto invisible */
</script>
</body>
</html>
